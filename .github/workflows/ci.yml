name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: la_forge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/la_forge_test
      NEXTAUTH_SECRET: ci-only-dummy-secret
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Next 16 requires >=20.9.0.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Blocking gate. The runtime tree has no advisories at any severity, so
      # this can be strict: anything reaching the deployed app fails the build.
      # Dev-only advisories are reported by the next step instead, so a broken
      # test-tooling dependency cannot block a member-facing fix.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      # Advisory only: prints the full picture, dev dependencies included, so a
      # new advisory is visible in the log without failing unrelated work.
      - name: Audit all dependencies (report only)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Ahead of the tests, not after them: the login throttle keeps its
      # counters in a table, and its tests exercise the real SQL rather than a
      # stand-in, so they need the schema to exist first. Still validates the
      # migrations, which was this step's original job.
      - name: Apply migrations (validates schema)
        run: npm run db:deploy

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
