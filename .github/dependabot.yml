version: 2

updates:
  # The app carries members' injury and health history, so a known-vulnerable
  # transitive package should not sit unnoticed between manual audits.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per week for routine bumps; security advisories still open their
      # own PR immediately, outside this group.
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Prisma 7 is a deliberate migration, not a dependency bump: it makes the
      # generator's `output` argument mandatory and lands on the code this app
      # is most exposed to — the raw upsert and BigInt handling in
      # lib/rate-limit.ts, and the binaryTargets that keep the query engine
      # matching the Lambda runtime. The bot's PR fails CI, and merging it on a
      # green run would be worse. Both packages are listed because they version
      # in lockstep and would otherwise arrive as two separate PRs.
      #
      # Security advisories are NOT suppressed by this: Dependabot still opens
      # those regardless of an ignore rule, which is the point of the rule being
      # scoped to major versions only.
      - dependency-name: prisma
        update-types:
          - version-update:semver-major
      - dependency-name: '@prisma/client'
        update-types:
          - version-update:semver-major

      # `@types/node` tracks the Node version the app actually runs on, which
      # is 22 everywhere: .nvmrc, netlify.toml and .github/workflows/ci.yml.
      # Letting it run ahead makes TypeScript accept APIs that do not exist in
      # the deployed runtime — a green typecheck and a crash in a Lambda. Bump
      # it deliberately, in the same commit that raises Node itself.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major

      # Tailwind 4 moves configuration out of tailwind.config.ts and into CSS,
      # so the bot's PR cannot carry the migration and fails on the config file
      # it leaves behind. tailwind-merge majors are pinned to a Tailwind major
      # and quietly change how `cn()` resolves conflicting classes, which no
      # test covers — the two have to move together, by hand.
      - dependency-name: tailwindcss
        update-types:
          - version-update:semver-major
      - dependency-name: tailwind-merge
        update-types:
          - version-update:semver-major

      # typescript-eslint refuses to load under TS 7 and fails the lint step
      # outright. Nothing to decide here until it ships support upstream.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
